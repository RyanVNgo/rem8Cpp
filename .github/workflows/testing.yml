name: rem8C++ Testing
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:          
  test:
    name: Check Builds and Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Debug Build
        run: |
          cmake --preset debug-ninja

      - name: Build debug and tests
        run: |
          cmake --build --preset rem8Cpp-debug-ninja

      - name: Run Tests
        run: |
          ctest --test-dir build/debug/tests
      
